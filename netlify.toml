# ══════════════════════════════════════════════════════════════════════════════
# InterviewKit — Netlify Frontend Configuration
# ══════════════════════════════════════════════════════════════════════════════
# The backend API URL is retrieved dynamically from environment variables
# (BACKEND_URL or VITE_API_URL) via scripts/generate-redirects.cjs at build time,
# so the backend URL is never hardcoded.

[build]
  command = "pnpm --filter @interviewkit/web run build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "20"


# Security & Cache Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
